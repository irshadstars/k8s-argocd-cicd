apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: cicd
  labels:
    app: webapp
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      # 31080, not 30080: the irshadproject cluster already binds 30080 on the
      # host, and kind/cicd-cluster.yaml maps this port so the app is reachable
      # at http://localhost:31080 without a port-forward.
      nodePort: 31080
